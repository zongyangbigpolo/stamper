name: Build Android APKs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full: bundles the offline Alibaba SenseVoice Chinese ASR model (~300MB APK)
          - flavor: full
            task: Full
          # Lite: no bundled model, uses the phone's system speech recognizer (~21MB APK)
          - flavor: lite
            task: Lite

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache offline ASR runtime & model
        if: matrix.flavor == 'full'
        uses: actions/cache@v4
        with:
          path: |
            app/libs/sherpa-onnx-*.aar
            app/src/full/assets/asr/sensevoice/model.int8.onnx
            app/src/full/assets/asr/sensevoice/tokens.txt
          key: asr-${{ hashFiles('scripts/fetch_asr_model.sh') }}

      - name: Fetch offline ASR runtime & model
        if: matrix.flavor == 'full'
        run: ./scripts/fetch_asr_model.sh

      - name: Prepare shared signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.STAMPER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/stamper.keystore"
            echo "STAMPER_KEYSTORE_FILE=$RUNNER_TEMP/stamper.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::STAMPER_KEYSTORE_BASE64 secret not set; APK is signed with a throwaway key and cannot upgrade an existing install."
          fi

      - name: Unit tests & assemble ${{ matrix.flavor }}
        env:
          STAMPER_KEYSTORE_PASSWORD: ${{ secrets.STAMPER_KEYSTORE_PASSWORD }}
          STAMPER_KEY_ALIAS: ${{ secrets.STAMPER_KEY_ALIAS }}
          STAMPER_KEY_PASSWORD: ${{ secrets.STAMPER_KEY_PASSWORD }}
        run: ./gradlew test${{ matrix.task }}DebugUnitTest assemble${{ matrix.task }}Debug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stamper-${{ matrix.flavor }}
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/stamper-${{ matrix.flavor }}.apk
          compression-level: 0
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release with both APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Stamper ${GITHUB_REF_NAME}" \
            --notes "- **stamper-full.apk**：内置阿里 SenseVoice 离线中文语音识别（约 300MB，推荐国产手机使用）
          - **stamper-lite.apk**：轻量版（约 21MB），使用手机系统语音识别或输入法语音" \
            dist/stamper-full.apk dist/stamper-lite.apk
